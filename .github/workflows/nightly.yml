name: Nightly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          # ubuntu-latest already contains this version. Pin it instead of following the
          # action's moving default, which can briefly point at a not-yet-published archive.
          cmdline-tools-version: '12.0'

      - name: Install Android 17 SDK
        shell: bash
        run: |
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          echo "Android 17 SDK candidates:"
          grep -Ei 'cinnamon|platforms;android-37|build-tools;37' /tmp/sdk-packages.txt || true

          PLATFORM_PACKAGE="$(awk -F'|' '
            BEGIN { IGNORECASE=1 }
            {
              path=$1; desc=$3
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", path)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", desc)
              if (path ~ /^platforms;/ && (path ~ /cinnamon|android-37/ || desc ~ /cinnamon|platform 37/)) {
                print path
                exit
              }
            }
          ' /tmp/sdk-packages.txt)"

          BUILD_TOOLS_PACKAGE="$(awk -F'|' '
            {
              path=$1
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", path)
              if (path ~ /^build-tools;37/) print path
            }
          ' /tmp/sdk-packages.txt | sort -V | tail -n1)"

          if [[ -z "$PLATFORM_PACKAGE" ]]; then
            echo "Could not find Android 17/Cinnamon Bun platform package. Available platforms:" >&2
            grep -E '^[[:space:]]*platforms;' /tmp/sdk-packages.txt | tail -n 30 >&2 || true
            exit 1
          fi
          if [[ -z "$BUILD_TOOLS_PACKAGE" ]]; then
            echo "Could not find Build Tools 37 package." >&2
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE and $BUILD_TOOLS_PACKAGE"
          sdkmanager --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"

          PLATFORM_ID="${PLATFORM_PACKAGE#platforms;}"
          if [[ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" && -d "$ANDROID_SDK_ROOT/platforms/$PLATFORM_ID" ]]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/$PLATFORM_ID" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable Nightly APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk oos-launcher-customizer-nightly.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: oos-launcher-customizer-nightly
          path: oos-launcher-customizer-nightly.apk
          if-no-files-found: error

      - name: Publish Nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            oos-launcher-customizer-nightly.apk \
            --target "$GITHUB_SHA" \
            --title "Nightly" \
            --prerelease \
            --notes "Automated Nightly build from commit $GITHUB_SHA. This APK is debug-signed so it can be installed directly."
